# Eat our own dog food: scan this repo with the CLI built from the same commit.
name: rustmaninoff

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build rustmaninoff
        run: cargo build --release -p rustmaninoff --locked
      - name: Rustmaninoff IaC scan
        run: |
          ./target/release/rustmaninoff scan . \
            --fail-on HIGH \
            --output sarif \
            --sarif-file rustmaninoff.sarif \
            --soft-fail \
            --compact
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: rustmaninoff.sarif