metadata:
  id: CKV_K8S_152
  name: Prevent NGINX Ingress annotation snippets which contain LUA code execution. See CVE-2021-25742
  category: KUBERNETES
  severity: HIGH
  framework: kubernetes
  guidelines: Adapted from Checkov CKV_K8S_152. https://github.com/bridgecrewio/checkov
resource_types:
- Ingress
definition:
  cond_type: no_element
  attribute: metadata.annotations
  where:
    and:
    - cond_type: attribute
      attribute: key
      operator: contains
      value: snippet
    - cond_type: attribute
      attribute: value
      operator: regex_match
      value: '\blua_|_lua\b|_lua_|\bkubernetes\.io\b'
fixtures:
  fail: |-
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: bad
      annotations:
        nginx.ingress.kubernetes.io/server-snippet: |
          lua_package_path "/etc/nginx/lua/?.lua;;";
    spec:
      rules:
      - host: example.com
        http:
          paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: svc
                port:
                  number: 80
  pass: |-
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: good
      annotations:
        nginx.ingress.kubernetes.io/server-snippet: |
          return 200;
        nginx.ingress.kubernetes.io/rewrite-target: /
        note: lua_package_path
    spec:
      rules:
      - host: example.com
        http:
          paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: svc
                port:
                  number: 80