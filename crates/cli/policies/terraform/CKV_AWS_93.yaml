metadata:
  id: CKV_AWS_93
  name: Ensure S3 bucket policy does not lockout all but root user
  category: IAM
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_93. https://github.com/bridgecrewio/checkov
resource_types:
- aws_s3_bucket
- aws_s3_bucket_policy
definition:
  cond_type: no_element
  attribute: policy.Statement
  where:
    and:
    - cond_type: attribute
      attribute: Effect
      operator: equals
      value: Deny
    - cond_type: attribute
      attribute: Condition
      operator: not_exists
    - cond_type: attribute
      attribute: NotAction
      operator: not_exists
    - or:
      - cond_type: attribute
        attribute: Principal
        operator: equals_any
        value: '*'
      - cond_type: attribute
        attribute: Principal.AWS
        operator: equals_any
        value: '*'
    - or:
      - cond_type: attribute
        attribute: Action
        operator: equals
        value: '*'
      - cond_type: attribute
        attribute: Action
        operator: intersects
        value:
        - s3:PutBucketPolicy
        - s3:*BucketPolicy
        - s3:Put*
        - s3:*
        - '*'
fixtures:
  fail: |
    resource "aws_s3_bucket_policy" "bad" {
      bucket = "data"
      policy = jsonencode({
        Statement = [{
          Effect    = "Deny"
          Principal = "*"
          Action    = "s3:PutBucketPolicy"
          Resource  = "*"
        }]
      })
    }
  pass: |
    resource "aws_s3_bucket_policy" "good" {
      bucket = "data"
      policy = jsonencode({
        Statement = [{
          Effect    = "Deny"
          Principal = "*"
          Action    = "s3:GetObject"
          Resource  = "*"
        }]
      })
    }