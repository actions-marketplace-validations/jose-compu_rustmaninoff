metadata:
  id: CKV_AWS_112
  name: Ensure Session Manager data is encrypted in transit
  category: ENCRYPTION
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_112. https://github.com/bridgecrewio/checkov
resource_types:
- aws_ssm_document
definition:
  or:
  - cond_type: attribute
    attribute: document_type
    operator: not_equals
    value: Session
  - cond_type: attribute
    attribute: content.inputs.kmsKeyId
    operator: exists
    missing: fail
fixtures:
  fail: |
    resource "aws_ssm_document" "bad" {
      name          = "bad"
      document_type = "Session"
      content = jsonencode({
        schemaVersion = "1.0"
        inputs        = {}
      })
    }
  pass: |
    resource "aws_ssm_document" "good" {
      name          = "good"
      document_type = "Session"
      content = jsonencode({
        schemaVersion = "1.0"
        inputs = {
          kmsKeyId = "alias/session-manager"
        }
      })
    }